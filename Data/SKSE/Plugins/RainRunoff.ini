[General]
Enabled = true
; World units. Only full-detail, loaded exterior statics are scanned.
Radius = 6000
MaxRoofs = 24
CandidatesPerTick = 1
ScanSeconds = 2
DebugLog = false

[Detection]
; Broad category hints, not a list of individual models. Empty IncludeTokens opts all statics in.
IncludeTokens = architecture,house,roof,farm,building,hut,shack,dwelling
ExcludeTokens = interior,dungeon,cave,furniture,clutter,door,tree,rock,landscape,statue
MinimumSpan = 128
CornerOutset = 12
RequireSky = true
CollisionFallback = true
SampleResolution = 7
MaxTriangles = 50000
; Actual minimum clearance is the player's standing scaled bounds height, read at runtime.
MaxDrop = 2048

[Appearance]
BuildupSeconds = 8
DrainSeconds = 12
; Full-rain width at the top, in world units. Bottom taper is authored in stream.nif.
TopWidth = 10
Opacity = 0.48
ScrollSpeed = 1.8
EffectModel = RainRunoff\stream.nif
